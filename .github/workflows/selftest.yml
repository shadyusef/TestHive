name: selftest
on: [push, pull_request]
jobs:
  selftest:
    runs-on: windows-latest  # TestHive targets Windows; the bash scripts run in Git Bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/selftest.sh
        shell: bash
      - name: Web tools, so the Studio demos also click through the pages in a real browser
        run: cd web && npm ci && npx playwright install --with-deps chromium && npm install -g newman
        shell: bash
      - name: Phase 1 demo (recorded agent run)
        run: bash demo/phase1/run.sh
        shell: bash
      - name: Phase 2 demo (recorded agent runs)
        run: bash demo/phase2/run.sh
        shell: bash
      - name: Phase 2b demo (Studio, driven through its API)
        run: bash demo/phase2b/run.sh --check
        shell: bash
      - name: Phase 2c demo (Studio from an empty project)
        run: bash demo/phase2c/run.sh --check
        shell: bash
      - name: Phase 2d demo (Run buttons, recorded agents)
        run: bash demo/phase2d/run.sh --check
        shell: bash
      - name: Phase 3 demo (tool advice)
        run: bash demo/phase3/run.sh --check
        shell: bash
      - name: Phase 4 demo (automation; real tests against the local stand-in app)
        run: bash demo/phase4/run.sh --check
        shell: bash
      - name: Phase 5 demo (execution; a test cycle with a planted bug, a fix and a flaky test)
        run: bash demo/phase5/run.sh --check
        shell: bash
      - name: Phase 5b demo (run targets; BrowserStack played by local stand-ins, made-up keys)
        run: bash demo/phase5b/run.sh --check
        shell: bash
      - name: Windows launcher
        shell: pwsh
        run: |
          .\hive.cmd gen-user
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs; exit 1 }
          }
