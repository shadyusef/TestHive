name: selftest
on: [push, pull_request]
jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: bash scripts/selftest.sh
        shell: bash
      - name: Web tools, so the Studio demos also click through the pages in a real browser (Linux only, to keep the run short)
        if: runner.os == 'Linux'
        run: cd web && npm ci && npx playwright install --with-deps chromium
        shell: bash
      - name: Phase 1 demo (recorded agent run)
        run: bash demo/phase1/run.sh
        shell: bash
      - name: Phase 2 demo (recorded agent runs)
        run: bash demo/phase2/run.sh
        shell: bash
      - name: Phase 2b demo (Studio, driven through its API)
        run: bash demo/phase2b/run.sh --check
        shell: bash
      - name: Phase 2c demo (Studio from an empty project)
        run: bash demo/phase2c/run.sh --check
        shell: bash
      - name: Phase 2d demo (Run buttons, recorded agents)
        run: bash demo/phase2d/run.sh --check
        shell: bash
      - name: Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\hive.cmd gen-user
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs; exit 1 }
          }
