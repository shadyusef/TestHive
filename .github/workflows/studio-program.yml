name: studio-program
# Builds the single TestHive Studio program per operating system, checks it on a fresh project copy, and keeps it as a
# download on the run (Actions > the run > Artifacts). On a version tag (v*) it is also attached to that GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: testhive-studio.exe
            asset: testhive-studio-windows.exe
          - os: macos-latest
            file: testhive-studio
            asset: testhive-studio-macos
          - os: ubuntu-latest
            file: testhive-studio
            asset: testhive-studio-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python scripts/build-studio.py
      - name: Check the program on a fresh project copy
        run: python tests/studio_program_check.py dist/${{ matrix.file }}
      - name: Name it for this system, with its SHA-256 checksum
        shell: bash
        run: |
          mv "dist/${{ matrix.file }}" "dist/${{ matrix.asset }}"
          python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest() + '  ' + p.split('/')[-1])" "dist/${{ matrix.asset }}" > "dist/${{ matrix.asset }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |  # the three builds may all try to create the release; the ones that lose the race just upload
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md" || true
          gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.asset }}" "dist/${{ matrix.asset }}.sha256" --clobber
