name: studio-program
# Builds the single TestHive Studio program for Windows, checks it on a fresh project copy, and keeps it as a
# download on the run (Actions > the run > Artifacts). On a version tag (v*) it is also attached to that GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      FILE: testhive-studio.exe
      ASSET: testhive-studio-windows.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python scripts/build-studio.py
      - name: Check the program on a fresh project copy
        run: python tests/studio_program_check.py dist/${{ env.FILE }}
      - name: Name it, with its SHA-256 checksum
        shell: bash
        run: |
          mv "dist/${{ env.FILE }}" "dist/${{ env.ASSET }}"
          python -c "import hashlib,sys; p=sys.argv[1]; print(hashlib.sha256(open(p,'rb').read()).hexdigest() + '  ' + p.split('/')[-1])" "dist/${{ env.ASSET }}" > "dist/${{ env.ASSET }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" "dist/${{ env.ASSET }}" "dist/${{ env.ASSET }}.sha256" --clobber
