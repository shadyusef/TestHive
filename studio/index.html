<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestHive Studio</title>
<!-- TestHive Studio lite: served by scripts/lib/studio.py on 127.0.0.1. Markup and styles here, the logic in app.js.
     Plain HTML/CSS/JS, no libraries, no build step. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dde1e8; --soft: #eef1f5;
  --accent: #284a8c; --accent-text: #ffffff; --edit: #fff8db; --dirty: #fff0c2;
  --ok: #1f7a4d; --ok-bg: #e3f4ea; --warn: #8a5a00; --warn-bg: #fdf1d8; --bad: #b42318; --bad-bg: #fde8e6;
  --wait: #2457b5; --wait-bg: #e5edfb; --idle: #6b7280; --idle-bg: #eef0f3;
  --radius: 8px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d3442; --soft: #232a35;
  --accent: #7aa2f7; --accent-text: #0f1420; --edit: #2b2717; --dirty: #3a3216;
  --ok: #5fd39a; --ok-bg: #173326; --warn: #f2c35b; --warn-bg: #3a2f14; --bad: #ff8a80; --bad-bg: #3d1d1b;
  --wait: #8fb4ff; --wait-bg: #1c2a44; --idle: #9aa3b2; --idle-bg: #262c37; --shadow: none; } }
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1b2029; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d3442; --soft: #232a35;
  --accent: #7aa2f7; --accent-text: #0f1420; --edit: #2b2717; --dirty: #3a3216;
  --ok: #5fd39a; --ok-bg: #173326; --warn: #f2c35b; --warn-bg: #3a2f14; --bad: #ff8a80; --bad-bg: #3d1d1b;
  --wait: #8fb4ff; --wait-bg: #1c2a44; --idle: #9aa3b2; --idle-bg: #262c37; --shadow: none; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans Arabic", Arial, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; margin: 0; } header .project { color: var(--muted); }
header .spacer { flex: 1; }
main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 80px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
textarea { width: 100%; min-height: 34px; resize: vertical; }
.edit { background: var(--edit); }
a { color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
.module-card { cursor: pointer; } .module-card:hover { border-color: var(--accent); }
.module-card h2 { margin: 0 0 8px; font-size: 18px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
.s-approved { background: var(--ok-bg); color: var(--ok); } .s-awaiting_approval { background: var(--wait-bg); color: var(--wait); }
.s-in_progress { background: var(--warn-bg); color: var(--warn); } .s-pending { background: var(--idle-bg); color: var(--idle); }
.sev-High { background: var(--bad-bg); color: var(--bad); } .sev-Medium { background: var(--warn-bg); color: var(--warn); } .sev-Low { background: var(--idle-bg); color: var(--idle); }
.next { background: var(--soft); border-radius: 6px; padding: 8px 10px; }
.next code { background: var(--panel); border: 1px solid var(--line); padding: 1px 6px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 12px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 12px 0; flex-wrap: wrap; }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 14px; }
.tabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.bar .grow { flex: 1; min-width: 180px; }
.stats { display: flex; flex-wrap: wrap; gap: 18px; } .stat b { font-size: 20px; display: block; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: start; vertical-align: top; padding: 7px 9px; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--soft); font-size: 12px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); z-index: 1; }
tr.dirty td { background: var(--dirty); }
tr.removed td { opacity: .5; text-decoration: line-through; }
td.id { white-space: nowrap; font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; }
.detail td { background: var(--soft); }
.detail dl { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin: 0; }
.detail dt { color: var(--muted); }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 20px; display: none; align-items: center; gap: 12px; z-index: 6; }
.savebar.show { display: flex; }
.msg { border-radius: 6px; padding: 8px 12px; margin: 8px 0; white-space: pre-wrap; }
.msg.ok { background: var(--ok-bg); color: var(--ok); } .msg.bad { background: var(--bad-bg); color: var(--bad); } .msg.warn { background: var(--warn-bg); color: var(--warn); }
.toast { position: fixed; right: 20px; bottom: 70px; max-width: 520px; z-index: 9; box-shadow: var(--shadow); }
.form { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; align-items: start; }
.form label { padding-top: 5px; color: var(--muted); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal .card { width: min(460px, 92vw); }
.modal .card.wide { width: min(920px, 94vw); max-height: 86vh; overflow: auto; }
ul.plain { margin: 4px 0; padding-inline-start: 18px; }
.crumb { cursor: pointer; color: var(--accent); }
@media (max-width: 700px) { .cards { grid-template-columns: 1fr; } .form { grid-template-columns: 1fr; } main { padding: 12px 16px 80px; } }
</style>
</head>
<body>
<header>
  <h1>TestHive Studio</h1><span class="project" id="project"></span>
  <span class="spacer"></span>
  <button id="projbtn" title="Project details">Project</button> <span class="small muted">You are</span> <button id="who" title="Change your name"></button>
  <button id="theme" title="Light or dark">◐</button>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div class="savebar" id="savebar"><span id="savetext"></span><span class="spacer" style="flex:1"></span>
  <button id="discard">Discard</button><button class="primary" id="save">Save</button></div>
<script src="app.js"></script>
</body>
</html>
