<svg xmlns="http://www.w3.org/2000/svg" width="980" height="626" viewBox="0 0 980 626" font-family="Segoe UI, Arial, sans-serif"><title>How TestHive works</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="980" height="626" fill="#FFFFFF"/>
<rect x="330" y="18" width="320" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="490.0" y="43.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#712B13">You: a module, its documents, a URL or an APK</text>
<line x1="490" y1="68" x2="490" y2="90" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="250" y="92" width="480" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="490.0" y="110.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">testhive-lead</text>
<text x="490.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">plans each stage, briefs the agents, keeps the board; never decides</text>
<line x1="490" y1="142" x2="490" y2="160" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="92.0" y1="160" x2="872.0" y2="160" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="92.0" y1="160" x2="92.0" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="22" y="186" width="140" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="92.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">1. Analysis</text>
<text x="92.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">business-analyst</text>
<text x="92.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">requirements and</text>
<text x="92.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">questions (gaps)</text>
<line x1="92.0" y1="290" x2="92.0" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="22" y="312" width="140" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="92.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">you answer</text>
<line x1="162" y1="238" x2="178" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="170.0" cy="329" r="7" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><path d="M166.5 329l2.5 2.5l4.5-5" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round"/>
<line x1="248.0" y1="160" x2="248.0" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="178" y="186" width="140" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="248.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">2. Design</text>
<text x="248.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">manual-tester</text>
<text x="248.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">test cases;</text>
<text x="248.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">qa-reviewer checks</text>
<line x1="248.0" y1="290" x2="248.0" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="178" y="312" width="140" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="248.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">you review</text>
<line x1="318" y1="238" x2="334" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="326.0" cy="329" r="7" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><path d="M322.5 329l2.5 2.5l4.5-5" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round"/>
<line x1="404.0" y1="160" x2="404.0" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="334" y="186" width="140" height="104" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="404.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">3. Tools</text>
<text x="404.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">decision matrix</text>
<text x="404.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">per test type</text>
<text x="404.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">(no AI)</text>
<line x1="404.0" y1="290" x2="404.0" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="334" y="312" width="140" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="404.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">you choose</text>
<line x1="474" y1="238" x2="490" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="482.0" cy="329" r="7" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><path d="M478.5 329l2.5 2.5l4.5-5" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round"/>
<line x1="560.0" y1="160" x2="560.0" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490" y="186" width="140" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="560.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">4. Automation</text>
<text x="560.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">web, API, mobile</text>
<text x="560.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">engineers; contract</text>
<text x="560.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">tests; stable 3/3</text>
<line x1="560.0" y1="290" x2="560.0" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="490" y="312" width="140" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="560.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">you approve</text>
<line x1="630" y1="238" x2="646" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="638.0" cy="329" r="7" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><path d="M634.5 329l2.5 2.5l4.5-5" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round"/>
<line x1="716.0" y1="160" x2="716.0" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="646" y="186" width="140" height="104" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="716.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">5. Execution</text>
<text x="716.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">a test cycle: local</text>
<text x="716.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">or BrowserStack;</text>
<text x="716.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">defect-triage</text>
<line x1="716.0" y1="290" x2="716.0" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="646" y="312" width="140" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="716.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">you record, approve</text>
<line x1="786" y1="238" x2="802" y2="238" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<circle cx="794.0" cy="329" r="7" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><path d="M790.5 329l2.5 2.5l4.5-5" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round"/>
<line x1="872.0" y1="160" x2="872.0" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="802" y="186" width="140" height="104" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="872.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">6. Reporting</text>
<text x="872.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">bug register, HTML</text>
<text x="872.0" y="250.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">report with Go /</text>
<text x="872.0" y="267.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">No-go suggestion</text>
<line x1="872.0" y1="290" x2="872.0" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="802" y="312" width="140" height="34" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="872.0" y="329.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="bold" fill="#712B13">you decide Go/No-go</text>
<rect x="22" y="372" width="452" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="248.0" y="391.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Plain files in your project, reviewable in git</text>
<text x="248.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">registers, test cases, baselines frozen at each approval,</text>
<text x="248.0" y="428.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">runs with screenshots, videos and API logs, the approvals log</text>
<rect x="506" y="372" width="452" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="732.0" y="391.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Runs on</text>
<text x="732.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Android (Maestro) on your device or BrowserStack, iOS on BrowserStack,</text>
<text x="732.0" y="428.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">web (Playwright, local or BrowserStack), API (Postman + Newman)</text>
<rect x="22" y="468" width="936" height="92" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="490.0" y="498.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#0C447C">TestHive Studio: the whole flow in the browser, no terminal needed</text>
<text x="490.0" y="518.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Run buttons start the agents; answer their questions (Allow once / Deny); review and approve each stage;</text>
<text x="490.0" y="535.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">test cycles, bugs, evidence and the report; explore a web app or an Android app. Also one Windows program for colleagues.</text>
<rect x="22" y="580" width="16" height="16" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="46" y="588" dominant-baseline="central" font-size="13" fill="#444441">Orchestrator</text>
<rect x="166.4" y="580" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.4" y="588" dominant-baseline="central" font-size="13" fill="#444441">AI agents (Claude Code)</text>
<rect x="390.0" y="580" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="414.0" y="588" dominant-baseline="central" font-size="13" fill="#444441">Scripts, no AI</text>
<rect x="548.8" y="580" width="16" height="16" rx="3" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="572.8" y="588" dominant-baseline="central" font-size="13" fill="#444441">A person decides</text>
<rect x="722.0" y="580" width="16" height="16" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="746.0" y="588" dominant-baseline="central" font-size="13" fill="#444441">Studio</text>
<circle cx="831.2" cy="588" r="7" fill="#FFFFFF" stroke="#993C1D" stroke-width="1.2"/><path d="M827.7 588l2.5 2.5l4.5-5" fill="none" stroke="#993C1D" stroke-width="1.4" stroke-linecap="round"/>
<text x="847.2" y="588" dominant-baseline="central" font-size="13" fill="#444441">Approval gate</text>
</svg>