appId: ${APP_ID}
tags:
  - smoke
---
- runFlow: ../../subflows/launch-clean.yaml
# PLACEHOLDER: ".*" matches anything, so this proves only that the app opened.
# gate.sh rejects a "Done" case whose flow still has it.
- extendedWaitUntil:
    visible: ".*"
    timeout: 10000
