<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign-up mock-up</title>
<!-- Fictional design mock-up for the TestHive phase 1 demo: two phone screens side by side. -->
<style>
  body { margin: 0; background: #e9e6e0; font-family: Segoe UI, Arial, sans-serif; display: flex; gap: 40px; padding: 30px; }
  .phone { width: 340px; height: 640px; background: #fff; border-radius: 28px; border: 10px solid #222; overflow: hidden; }
  .bar { background: #2f5d3a; color: #fff; padding: 16px; font-size: 18px; }
  .body { padding: 18px; } h2 { font-size: 20px; margin: 4px 0 14px; }
  .field { border: 1px solid #bbb; border-radius: 6px; padding: 11px; margin: 10px 0; color: #888; font-size: 14px; }
  .btn { background: #2f5d3a; color: #fff; text-align: center; padding: 12px; border-radius: 8px; margin-top: 18px; }
  .boxes { display: flex; gap: 8px; margin: 18px 0; } .boxes div { width: 42px; height: 50px; border: 1px solid #999; border-radius: 6px; }
  .note { font-size: 13px; color: #555; } .toggle { display: flex; gap: 8px; } .toggle div { flex: 1; text-align: center; border: 1px solid #2f5d3a; border-radius: 6px; padding: 8px; font-size: 14px; }
  .label { font-size: 12px; color: #444; margin-top: 4px; }
</style></head>
<body>
  <div class="phone"><div class="bar">Nakhla Rewards</div><div class="body">
    <h2>Create your account</h2>
    <div class="field">Full name</div>
    <div class="field">Mobile number (05XXXXXXXX)</div>
    <div class="field">Password</div>
    <div class="field">Date of birth</div>
    <div class="label">Language</div>
    <div class="toggle"><div>العربية</div><div>English</div></div>
    <div class="btn">Sign up</div>
  </div></div>
  <div class="phone"><div class="bar">Nakhla Rewards</div><div class="body">
    <h2>Verify your number</h2>
    <div class="note">Enter the code we sent by SMS.</div>
    <div class="boxes"><div></div><div></div><div></div><div></div><div></div><div></div></div>
    <div class="btn">Verify</div>
    <div class="note" style="margin-top:16px">Resend code</div>
  </div></div>
</body></html>
