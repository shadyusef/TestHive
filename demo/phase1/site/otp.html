<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nakhla Rewards - Verify your number</title>
<!-- Fictional demo product for the TestHive phase 1 exploration demo. The demo code is 123456. -->
<style>
  body { font-family: Segoe UI, Tahoma, Arial, sans-serif; background: #f6f3ee; margin: 0; }
  header { background: #2f5d3a; color: #fff; padding: 14px 24px; font-size: 20px; }
  main { max-width: 460px; margin: 24px auto; background: #fff; padding: 24px; border-radius: 8px; }
  .boxes { display: flex; gap: 8px; margin-top: 12px; }
  .boxes input { width: 44px; height: 48px; text-align: center; font-size: 22px; }
  .error { color: #b00020; margin-top: 10px; }
  button { margin-top: 18px; padding: 10px 18px; background: #2f5d3a; color: #fff; border: 0; border-radius: 6px; }
  button:disabled { background: #9bb3a1; }
</style>
</head>
<body>
<header>Nakhla Rewards</header>
<main>
  <h1>Verify your mobile number</h1>
  <p>We sent a code by SMS. Enter it below.</p>
  <form id="otp" novalidate>
    <div class="boxes">
      <input name="d1" inputmode="numeric" maxlength="1" required aria-label="Digit 1">
      <input name="d2" inputmode="numeric" maxlength="1" required aria-label="Digit 2">
      <input name="d3" inputmode="numeric" maxlength="1" required aria-label="Digit 3">
      <input name="d4" inputmode="numeric" maxlength="1" required aria-label="Digit 4">
      <input name="d5" inputmode="numeric" maxlength="1" required aria-label="Digit 5">
      <input name="d6" inputmode="numeric" maxlength="1" required aria-label="Digit 6">
    </div>
    <div class="error" role="alert" id="otp-error" hidden></div>
    <button type="submit">Verify</button>
  </form>
  <button id="resend" type="button" disabled>Resend code (30)</button>
</main>
<script>
  let left = 30;
  const resend = document.getElementById('resend');
  const t = setInterval(() => { left--; resend.textContent = left > 0 ? `Resend code (${left})` : 'Resend code'; if (left <= 0) { resend.disabled = false; clearInterval(t); } }, 1000);
  document.getElementById('otp').addEventListener('submit', e => {
    e.preventDefault();
    const code = [...document.querySelectorAll('.boxes input')].map(i => i.value).join('');
    const err = document.getElementById('otp-error');
    if (code === '123456') { location.href = 'welcome.html'; return; }
    err.hidden = false; err.textContent = 'الرمز غير صحيح';   // shown in Arabic even when the page is in English
  });
</script>
</body>
</html>
